# Builds the macOS universal plugin, preserving committed bundle resources
# and Windows64 files. No Windows build job exists.
# Manual dispatch only: selected source determines the new tag and assets.

name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  # ---- edit these per-project, everything else is generic ----
  PRODUCT_NAME: Mail
  XCODE_PROJECT: Mail.xcodeproj
  VCX_SOLUTION: Mail.sln
  MACOS_DEPLOYMENT_TARGET: '11.0'
  # --------------------------------------------------------------

concurrency:
  group: release-publication
  cancel-in-progress: false

jobs:

  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set.outputs.tag }}
      version: ${{ steps.set.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - id: set
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py preflight --sha "$SELECTED_SHA"

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"

          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS plugin (universal)
        run: |
          set -euo pipefail
          BUNDLE_PATH="test/Plugins/${{ env.PRODUCT_NAME }}.bundle"
          # Remove only stale native outputs; retain committed resources and Windows64.
          rm -f "$BUNDLE_PATH/Contents/MacOS/${{ env.PRODUCT_NAME }}" \
            "$BUNDLE_PATH/Contents/Info.plist" \
            "$BUNDLE_PATH/Contents/Resources/English.lproj/InfoPlist.strings"
          rm -rf "$BUNDLE_PATH/Contents/_CodeSignature" \
            "test/Plugins/Default" "test/Plugins/${{ env.PRODUCT_NAME }}.build"
          xcodebuild -project "${{ env.XCODE_PROJECT }}" \
            -target "${{ env.PRODUCT_NAME }}" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="${{ env.MACOS_DEPLOYMENT_TARGET }}" \
            CONFIGURATION_BUILD_DIR="$PWD/test/Plugins" \
            build

      - name: verify universal binary
        run: |
          set -euo pipefail
          BUNDLE_PATH="test/Plugins/${{ env.PRODUCT_NAME }}.bundle"
          BIN="$BUNDLE_PATH/Contents/MacOS/${{ env.PRODUCT_NAME }}"
          lipo -info "$BIN"
          lipo -verify_arch arm64 x86_64 "$BIN"
          python3 .github/scripts/source_version.py --verify-bundle "$BUNDLE_PATH"
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          echo "Signing with: $IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        run: |
          set -euo pipefail
          VERSION="${{ needs.version.outputs.version }}"
          ZIP_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.zip"
          DMG_PATH="${{ env.PRODUCT_NAME }}-${VERSION}.dmg"

          # zip: cross-platform bundle (win + mac binaries together), what most users grab
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"

          # dmg: mac-friendly, and the only format Apple lets us staple a ticket to
          hdiutil create -format UDBZ -volname "${{ env.PRODUCT_NAME }}" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"

          xcrun notarytool submit "$ZIP_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait --output-format json > "$RUNNER_TEMP/zip-notary.json"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(data,dict) and data.get("status") == "Accepted" else "ZIP notarization was not Accepted")' "$RUNNER_TEMP/zip-notary.json"
          xcrun notarytool submit "$DMG_PATH" --keychain-profile "notarytool-profile" --keychain "$KEYCHAIN_PATH" --wait --output-format json > "$RUNNER_TEMP/dmg-notary.json"
          python3 -c 'import json,sys; data=json.load(open(sys.argv[1])); sys.exit(0 if isinstance(data,dict) and data.get("status") == "Accepted" else "DMG notarization was not Accepted")' "$RUNNER_TEMP/dmg-notary.json"
          xcrun stapler staple "$DMG_PATH"

          echo "ZIP_PATH=$ZIP_PATH" >> "$GITHUB_ENV"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      - name: final availability check and create-only publication
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 .github/scripts/release.py publish --sha "$SELECTED_SHA" "$ZIP_PATH" "$DMG_PATH"
